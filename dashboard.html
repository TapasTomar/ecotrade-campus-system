<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EcoTrade Campus — Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .top { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 14px 20px; border-radius: 10px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .box { background: #1e293b; padding: 18px; border-radius: 10px; }
    h3 { margin-top: 0; color: #10b981; }
    input, select { width: 100%; padding: 9px; margin: 5px 0 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { padding: 8px 14px; background: #10b981; color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .item { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #334155; }
    .badge { background: #334155; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
<div class="top">
  <div><strong style="color:#10b981;font-size:18px;">EcoTrade Campus</strong> — <span id="userInfo"></span></div>
  <button onclick="logout()" style="background:#ef4444;color:#fff;">Logout</button>
</div>

<div class="grid">
  <!-- LIST NEW ITEM -->
  <div class="box">
    <h3>List Item for Barter</h3>
    <input id="i_title" placeholder="Item Name (e.g. Engineering Graphics Kit)">
    <input id="i_cat" placeholder="Category (Books / Electronics / Tools)">
    <input id="i_cond" placeholder="Condition (Like New / Good)">
    <input id="i_exp" placeholder="Expected in Return">
    <button onclick="addItem()">Post Item</button>
  </div>

  <!-- INCOMING OFFERS -->
  <div class="box">
    <h3>Incoming Barter Offers</h3>
    <div id="offersList"></div>
  </div>

  <!-- EMERGENCY BLOOD BANK -->
  <div class="box">
    <h3>Blood Bank (C++ Priority Queue)</h3>
    <div id="bloodStock" style="margin-bottom:12px;font-size:14px;"></div>
    <select id="b_group">
      <option>O+</option><option>O-</option><option>A+</option><option>A-</option>
      <option>B+</option><option>B-</option><option>AB+</option><option>AB-</option>
    </select>
    <input id="b_units" type="number" value="1" min="1" placeholder="Units Required">
    <select id="b_urg">
      <option value="1">Urgency 1 — CRITICAL</option>
      <option value="2">Urgency 2 — HIGH</option>
      <option value="3">Urgency 3 — NORMAL</option>
    </select>
    <button onclick="dispatchBlood()">Dispatch Blood</button>
    <p id="bloodMsg" style="color:#38bdf8;font-size:13px;"></p>
  </div>
</div>

<div class="box" style="margin-top:20px;">
  <h3>Campus Barter Marketplace</h3>
  <div id="itemsList"></div>
</div>

<script>
const user = JSON.parse(localStorage.getItem('ecotrade_user') || 'null');
if (!user) window.location.href = '/';
document.getElementById('userInfo').innerText = `${user.name} (${user.student_id})`;

function logout() {
  localStorage.removeItem('ecotrade_user');
  window.location.href = '/';
}

async function addItem() {
  await fetch('/api/items', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      owner_id: user.student_id,
      title: document.getElementById('i_title').value,
      category: document.getElementById('i_cat').value || 'General',
      condition: document.getElementById('i_cond').value || 'Good',
      expected_return: document.getElementById('i_exp').value || 'Open to offers'
    })
  });
  loadAll();
}

async function sendOffer(itemId) {
  const offerText = prompt('What do you want to offer in exchange?');
  if (!offerText) return;
  const res = await fetch('/api/offers', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ item_id: itemId, bidder_id: user.student_id, offer_text: offerText })
  });
  const data = await res.json();
  alert(data.message || data.detail);
  loadAll();
}

async function acceptOffer(itemId, offerId) {
  const res = await fetch('/api/offers/accept', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ item_id: itemId, offer_id: offerId, owner_id: user.student_id })
  });
  const data = await res.json();
  alert(data.message ? `${data.message}\n4-Digit Handshake Code: ${data.handshake_code}` : data.detail);
  loadAll();
}

async function completeDeal(itemId) {
  const code = prompt('Enter the 4-Digit Handshake Code:');
  if (!code) return;
  const res = await fetch('/api/offers/complete', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ item_id: itemId, handshake_code: code })
  });
  const data = await res.json();
  alert(data.message || data.detail);
  loadAll();
}

async function dispatchBlood() {
  const res = await fetch('/api/blood/dispatch', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      blood_group: document.getElementById('b_group').value,
      units: parseInt(document.getElementById('b_units').value),
      urgency: parseInt(document.getElementById('b_urg').value)
    })
  });
  const data = await res.json();
  document.getElementById('bloodMsg').innerText = data.message || data.detail;
  loadAll();
}

async function loadAll() {
  const items = await (await fetch(`/api/items?viewer_id=${user.student_id}`)).json();
  document.getElementById('itemsList').innerHTML = items.map(i => `
    <div class="item">
      <strong>${i.title}</strong> <span class="badge">${i.status}</span><br>
      Owner: ${i.owner_name} (${i.owner_id}) | Mobile: <strong>${i.owner_mobile}</strong><br>
      Condition: ${i.condition} | Wants: ${i.expected_return}<br>
      ${i.handshake_code ? `<div style="color:#10b981;margin-top:4px;">4-Digit Meetup Code: <strong>${i.handshake_code}</strong></div>` : ''}
      ${i.status === 'OPEN' && i.owner_id !== user.student_id ? `<button style="margin-top:8px;" onclick="sendOffer(${i.id})">Send Offer</button>` : ''}
      ${i.status === 'ACCEPTED' ? `<button style="margin-top:8px;background:#3b82f6;color:#fff;" onclick="completeDeal(${i.id})">Verify Meetup Code</button>` : ''}
    </div>
  `).join('');

  const offers = await (await fetch(`/api/offers?owner_id=${user.student_id}`)).json();
  document.getElementById('offersList').innerHTML = offers.length ? offers.map(o => `
    <div class="item">
      <strong>${o.item_title}</strong> — Offer from ${o.bidder_name}: "${o.offer_text}"<br>
      Mobile: ${o.bidder_mobile} | Status: ${o.status}
      ${o.status === 'PENDING' ? `<br><button style="margin-top:6px;" onclick="acceptOffer(${o.item_id}, ${o.id})">Accept & Unlock Number</button>` : ''}
    </div>
  `).join('') : '<p style="color:#94a3b8;">No incoming offers yet.</p>';

  const stock = await (await fetch('/api/blood/stock')).json();
  document.getElementById('bloodStock').innerHTML = stock.map(s => `<span class="badge" style="margin:3px;display:inline-block;">${s.blood_group}: ${s.units}u</span>`).join('');
}

loadAll();
</script>
</body>
</html>
