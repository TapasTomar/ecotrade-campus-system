<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EcoTrade Campus — Login & Register</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 28px; border-radius: 12px; width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h2 { margin-top: 0; color: #10b981; text-align: center; }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tabs button { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; background: #334155; color: #fff; }
    .tabs button.active { background: #10b981; color: #0f172a; }
    input, select { width: 100%; padding: 10px; margin: 6px 0 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
    .row { display: flex; gap: 8px; }
    .btn { width: 100%; padding: 11px; background: #10b981; color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-sec { background: #3b82f6; color: #fff; width: auto; white-space: nowrap; padding: 0 14px; height: 38px; margin-top: 6px; }
    .msg { margin-top: 12px; font-size: 13px; text-align: center; color: #38bdf8; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="card">
  <h2>EcoTrade Campus</h2>
  <div class="tabs">
    <button id="tabLogin" class="active" onclick="showTab('login')">Login</button>
    <button id="tabSignup" onclick="showTab('signup')">Register</button>
  </div>

  <!-- LOGIN FORM -->
  <div id="loginBox">
    <input id="l_sid" placeholder="11-Digit Student ID">
    <input id="l_pass" type="password" placeholder="Password">
    <div class="row">
      <input id="l_otp" placeholder="Login OTP">
      <button class="btn btn-sec" onclick="sendOtp('login')">Send OTP</button>
    </div>
    <button class="btn" onclick="doLogin()">Login to Dashboard</button>
  </div>

  <!-- REGISTER FORM -->
  <div id="signupBox" class="hidden">
    <input id="s_sid" placeholder="11-Digit Student ID">
    <input id="s_name" placeholder="Full Name">
    <input id="s_email" type="email" placeholder="Email Address">
    <input id="s_mobile" placeholder="10-Digit Mobile Number">
    <select id="s_bg">
      <option value="O+">Blood Group: O+</option>
      <option value="O-">O-</option><option value="A+">A+</option><option value="A-">A-</option>
      <option value="B+">B+</option><option value="B-">B-</option><option value="AB+">AB+</option><option value="AB-">AB-</option>
    </select>
    <input id="s_pass" type="password" placeholder="Create Password">
    <div class="row">
      <input id="s_otp" placeholder="Email OTP">
      <button class="btn btn-sec" onclick="sendOtp('signup')">Send OTP</button>
    </div>
    <button class="btn" onclick="doSignup()">Create Account</button>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
function showTab(tab) {
  document.getElementById('loginBox').classList.toggle('hidden', tab !== 'login');
  document.getElementById('signupBox').classList.toggle('hidden', tab !== 'signup');
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
  document.getElementById('msg').innerText = '';
}

async function sendOtp(mode) {
  const payload = mode === 'login'
    ? { student_id: document.getElementById('l_sid').value }
    : { email: document.getElementById('s_email').value };

  document.getElementById('msg').innerText = 'Sending OTP...';
  const res = await fetch('/api/auth/send-otp', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
  });
  const data = await res.json();
  document.getElementById('msg').innerText = data.message || data.detail;
}

async function doSignup() {
  const payload = {
    student_id: document.getElementById('s_sid').value,
    name: document.getElementById('s_name').value,
    email: document.getElementById('s_email').value,
    mobile: document.getElementById('s_mobile').value,
    blood_group: document.getElementById('s_bg').value,
    password: document.getElementById('s_pass').value,
    otp: document.getElementById('s_otp').value
  };
  const res = await fetch('/api/auth/signup', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
  });
  const data = await res.json();
  document.getElementById('msg').innerText = data.message || data.detail;
  if (res.ok) showTab('login');
}

async function doLogin() {
  const payload = {
    student_id: document.getElementById('l_sid').value,
    password: document.getElementById('l_pass').value,
    otp: document.getElementById('l_otp').value
  };
  const res = await fetch('/api/auth/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (!res.ok) {
    document.getElementById('msg').innerText = data.detail;
    return;
  }
  localStorage.setItem('ecotrade_user', JSON.stringify(data));
  window.location.href = '/dashboard.html';
}
</script>
</body>
</html>
